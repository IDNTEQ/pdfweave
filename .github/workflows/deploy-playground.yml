name: Deploy Pages (playground + docs)

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'playground/**'
      - 'website/**'
      - '.github/workflows/deploy-playground.yml'
  workflow_dispatch:

# Allow only one concurrent deployment, skipping in-progress runs so newest
# main always wins.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Fetch tags so packages/common/set-version.js can stamp the
          # latest release version into the bundle (otherwise PDFWEAVE_VERSION
          # falls back to 'x.x.x' and shows that in the playground header).
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '20.x'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            playground/package-lock.json
            website/package-lock.json

      - name: Install root workspaces
        run: npm ci

      - name: Build packages
        run: npm run build

      # --- Playground (served at /pdfweave/) -----------------------------
      - name: Install playground dependencies
        run: npm ci --prefix playground

      - name: Build playground
        run: npm --prefix playground run build

      # --- Docs site (served at /pdfweave/docs/) -------------------------
      - name: Install website dependencies
        run: npm ci --prefix website

      - name: Build docs
        run: npm --prefix website run build

      # --- Assemble single Pages artifact --------------------------------
      - name: Assemble Pages artifact
        run: |
          mkdir -p pages-artifact
          cp -r playground/dist/. pages-artifact/
          mkdir -p pages-artifact/docs
          cp -r website/build/. pages-artifact/docs/
          # SPA fallback so the playground's client-side routes resolve on
          # deep-link reload. (Docusaurus emits its own per-page HTML.)
          cp pages-artifact/index.html pages-artifact/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-artifact

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
