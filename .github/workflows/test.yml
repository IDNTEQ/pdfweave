name: Testing

on: [pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pdfweave-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            playground/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: ./node_modules/.bin/vp run --filter '@pdfweave/*' lint
      - name: ESLint strict (deep gate)
        run: npm run lint:strict
      - run: npm run build
      - name: Bundle size check
        run: npm run size
      - name: npm audit (high+, runtime only)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run test
        env:
          CI: true
      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: 'PDFweave tests'
          path: 'packages/*/test-results.xml'
          reporter: 'java-junit'
          fail-on-error: 'true'
      - name: Coverage + CRAP
        run: npm run coverage:check
        env:
          CI: true
      - name: Upload coverage HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: |
            packages/*/coverage/
            coverage/
          retention-days: 14
      - name: Coverage PR comment
        if: github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-path: ./coverage/aggregate-summary.json
      - name: CRAP report exists?
        if: github.event_name == 'pull_request' && always()
        id: crap_exists
        run: |
          if [ -f coverage/crap-report.md ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: CRAP PR comment
        if: github.event_name == 'pull_request' && always() && steps.crap_exists.outputs.found == 'true'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: crap
          path: coverage/crap-report.md

  playground-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            playground/package-lock.json
      - name: Install workspace dependencies and build packages
        run: |
          npm ci
          npm run build
      - name: Install playground dependencies
        run: |
          npm ci --prefix playground
      - name: Install Puppeteer Chrome
        run: npm --prefix playground exec -- puppeteer browsers install chrome
      - name: Run playground checks
        run: |
          npm --prefix playground run lint
          npm --prefix playground run build
          npm --prefix playground run test
        env:
          CI: true
