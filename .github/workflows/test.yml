name: Testing

on: [pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pdfweave-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Use Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            playground/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: ./node_modules/.bin/vp run --filter '@pdfweave/*' lint
      - name: ESLint strict (deep gate)
        run: npm run lint:strict
      - run: npm run build
      - name: Bundle size check
        run: npm run size
      - name: npm audit (high+, runtime only)
        run: npm audit --omit=dev --audit-level=high
      - name: Run package tests
        id: package-tests
        run: npm run test
        env:
          CI: true
      - name: Build feature qualification dashboard
        if: always()
        run: npm run qualification:build
        env:
          QUALIFICATION_TEST_STATUS: ${{ steps.package-tests.outcome }}
      - name: Publish test report
        if: always()
        continue-on-error: true
        uses: dorny/test-reporter@v3
        with:
          name: 'PDFweave tests'
          path: 'packages/*/test-results.xml'
          reporter: 'java-junit'
          # The junit reporter emits per-workspace files when CI=true is
          # set on the test step. Vitest sometimes writes 0-byte files
          # for workspaces with no test files matched (pdf-lib in our
          # case). Don't gate the whole workflow on dorny's strictness;
          # the test step itself is the source of truth for pass/fail.
          fail-on-error: 'false'
          fail-on-empty: 'false'
      - name: Coverage + CRAP
        run: npm run coverage:check
        env:
          CI: true
          # Coverage instrumentation adds 2-4× to per-test runtime.
          # The integration-{playground,other,segmenter} tests assert
          # PERFORMANCE_THRESHOLD seconds as a regression detector;
          # under coverage they all blow past their per-file defaults
          # (1.5 / 2.5 / 5 sec). Override to 30s on the coverage run
          # only — the regular test step keeps the strict thresholds.
          PERFORMANCE_THRESHOLD: '30'
      - name: Upload coverage HTML
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-html
          path: |
            packages/*/coverage/
            coverage/
          retention-days: 14
      - name: Upload complex PDF render artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: complex-pdf-renders
          path: packages/generator/test-artifacts/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload imposition render artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: imposition-renders
          path: packages/imposition/test-artifacts/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload feature qualification dashboard
        id: qualification-dashboard
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pdfweave-qualification-report
          path: test-artifacts/qualification-report.html
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
      - name: Link feature qualification dashboard
        if: always() && steps.qualification-dashboard.outputs.artifact-url != ''
        run: echo "[Download the PDFweave qualification dashboard](${{ steps.qualification-dashboard.outputs.artifact-url }})" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload visual diff diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: visual-diff-diagnostics
          path: |
            packages/**/__image_actual__/
            packages/**/__image_diffs__/
            packages/**/__image_diff_report__/
          if-no-files-found: ignore
          retention-days: 14
      - name: Coverage PR comment
        if: github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-path: ./coverage/aggregate-summary.json
      - name: CRAP report exists?
        if: github.event_name == 'pull_request' && always()
        id: crap_exists
        run: |
          if [ -f coverage/crap-report.md ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: CRAP PR comment
        if: github.event_name == 'pull_request' && always() && steps.crap_exists.outputs.found == 'true'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: crap
          path: coverage/crap-report.md

  playground-test:
    runs-on: ubuntu-latest
    env:
      # Pin a fresh, workspace-local browser cache shared by the install and
      # test steps. Avoids the runner image's pre-populated ~/.cache/puppeteer
      # (a different Chrome build) masking/short-circuiting the install.
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}/.puppeteer-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Use Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            playground/package-lock.json
      - name: Install workspace dependencies and build packages
        run: |
          npm ci
          npm run build
      - name: Install playground dependencies
        run: |
          npm ci --prefix playground
      - name: Install Puppeteer Chrome
        working-directory: playground
        run: |
          # puppeteer's installer downloads the correct (~176 MB) Chrome zip
          # but its Node-based unzip silently extracts only empty directories
          # on the runner's Node 24 — the actual binary never lands, so the
          # E2E suite dies in beforeAll with "Could not find Chrome". Download
          # via puppeteer, then if the binary is missing extract the zip with
          # the system `unzip` (robust), preserving the EXACT pinned Chrome
          # version the screenshot snapshots are generated against.
          node_modules/.bin/puppeteer browsers install chrome || true
          EXE="$(node -e "console.log(require('puppeteer').executablePath())")"
          if [ ! -x "$EXE" ]; then
            ZIP="$(ls "$PUPPETEER_CACHE_DIR"/chrome/*.zip | head -1)"
            DEST="$(dirname "$(dirname "$EXE")")"
            echo "puppeteer extraction incomplete — unzipping $ZIP -> $DEST"
            unzip -q -o "$ZIP" -d "$DEST"
            chmod +x "$EXE"
          fi
          # Hard guard: the exact executable launch() resolves must exist, so
          # a silent install/extract failure fails here instead of mid-suite.
          test -x "$EXE"
      - name: Run playground checks
        run: |
          npm --prefix playground run lint
          npm --prefix playground run build
          npm --prefix playground run test
        env:
          CI: true
