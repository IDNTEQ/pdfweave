name: Release & Publish

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            playground/package-lock.json

      - run: npm ci

      - name: Build workspaces
        run: npm run build

      - name: Test common
        run: npm test -w packages/common

      - name: Test pdf-lib
        run: npm test -w packages/pdf-lib

      - name: Test schemas
        run: npm test -w packages/schemas

      - name: Test generator
        run: npm test -w packages/generator

      - name: Test imposition
        run: npm test -w packages/imposition

      - name: Test ui
        run: npm test -w packages/ui

      - name: Test converter
        run: npm test -w packages/converter

      - name: Test manipulator
        run: npm test -w packages/manipulator

      - name: Test cli
        run: npm test -w packages/cli

  publish-npm:
    name: Publish to NPM
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package: [common, pdf-lib, schemas, generator, imposition, ui, cli, converter, manipulator]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            playground/package-lock.json

      - name: Install the repository-pinned npm for OIDC publishing
        run: npm install -g npm@11.12.1

      - run: npm ci

      - name: Set release versions from tag
        env:
          RELEASE_PACKAGES: common pdf-lib schemas generator imposition ui cli manipulator converter
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          export VERSION
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          NPM_DIST_TAG="$(node scripts/npm-dist-tag.mjs "$VERSION")"
          echo "NPM_DIST_TAG=$NPM_DIST_TAG" >> "$GITHUB_ENV"

          node <<'NODE'
          const fs = require('node:fs');

          const version = process.env.VERSION;
          const packages = process.env.RELEASE_PACKAGES.split(/\s+/).filter(Boolean);
          const releaseNames = new Set(packages.map((name) => `@pdfweave/${name}`));

          for (const packageName of packages) {
            const file = `packages/${packageName}/package.json`;
            const packageJson = JSON.parse(fs.readFileSync(file, 'utf8'));
            packageJson.version = version;

            for (const section of [
              'dependencies',
              'devDependencies',
              'peerDependencies',
              'optionalDependencies',
            ]) {
              if (!packageJson[section]) continue;

              for (const dependencyName of Object.keys(packageJson[section])) {
                if (releaseNames.has(dependencyName)) {
                  packageJson[section][dependencyName] = version;
                }
              }
            }

            fs.writeFileSync(file, `${JSON.stringify(packageJson, null, 2)}\n`);
          }
          NODE

      - name: Build release artifacts
        run: npm run build

      - name: Check whether this version is already published
        id: published-version
        env:
          PACKAGE_NAME: '@pdfweave/${{ matrix.package }}'
        run: |
          ERROR_FILE="$(mktemp)"
          if npm view "$PACKAGE_NAME@$VERSION" version --json 2>"$ERROR_FILE" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif grep -q 'E404' "$ERROR_FILE"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            cat "$ERROR_FILE" >&2
            exit 1
          fi

      - name: Publish
        if: steps.published-version.outputs.exists != 'true'
        run: npm publish --provenance --access public --tag "$NPM_DIST_TAG" -w packages/${{ matrix.package }}

      - name: Report existing version
        if: steps.published-version.outputs.exists == 'true'
        run: echo "@pdfweave/${{ matrix.package }}@$VERSION is already published; skipping."

  create-github-release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm

      - name: Install the repository-pinned npm
        run: npm install -g npm@11.12.1

      - run: npm ci

      - name: Build qualification dashboard
        run: npm run qualification

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          gh release create "${{ github.ref_name }}" \
            --title "PDFweave v$VERSION" \
            --notes "See [CHANGELOG.md](https://github.com/IDNTEQ/pdfweave/blob/main/CHANGELOG.md) for details." \
            "test-artifacts/qualification-report.html#PDFweave qualification dashboard"
